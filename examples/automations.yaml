# Example automations for tracked_tasks.
#
# The preferred completion path is button.press targeting the task's mark-done
# button entity. NFC tags, Zigbee buttons, and dashboards should all use this
# same path so completion state is handled in one place.

- alias: Mark bins done from NFC
  trigger:
    - platform: tag
      tag_id: YOUR_TAG_ID
  action:
    - service: button.press
      target:
        entity_id: button.bins_mark_done

- alias: Mark bins done from Zigbee button
  trigger:
    - platform: state
      entity_id: sensor.bins_button_action
      to: "single"
  action:
    - service: button.press
      target:
        entity_id: button.bins_mark_done

- alias: Gentle bins reminder
  trigger:
    - platform: state
      entity_id: binary_sensor.bins_due
      to: "on"
  action:
    - service: notify.mobile_app_your_phone
      data:
        message: "Bins are due this evening."

- alias: Notify when bins overdue
  trigger:
    - platform: state
      entity_id: binary_sensor.bins_overdue
      to: "on"
  action:
    - service: notify.mobile_app_your_phone
      data:
        message: "Bins have not been done yet."

- alias: Escalate bins reminder
  trigger:
    - platform: state
      entity_id: binary_sensor.bins_overdue
      to: "on"
      for: "00:30:00"
  condition:
    - condition: state
      entity_id: binary_sensor.bins_overdue
      state: "on"
  action:
    - service: light.turn_on
      target:
        entity_id: light.kitchen
      data:
        flash: short
    - service: notify.mobile_app_your_phone
      data:
        message: "Bins are still overdue."
